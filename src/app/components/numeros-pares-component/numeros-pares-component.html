<h1> Numeros pares</h1>
<div class="mb-3">
<form form="ngForm">
    Inicio:
    <input type="number" name="cajainicio" #cajainicio class="form-controt"/>
    Fin
    <input type="number" name="cajafinal" #cajafinal class="btn-success"/>
    <button (click)="mostrarPares()">
        Ver pares
    </button>




</form>
</div>

<ul class="list-group">
    @for (numero of arrayNumeros; track numero) {

        <li class="list-group-item">{{numero}}</li>
    }
</ul>
